<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Участок №7</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Rubik:wght@400;500;600&family=Unbounded:wght@500;700&display=swap">
<style>
:root{color-scheme:dark;--bg:#0e1218;--panel:#161c26;--panel2:#1e2633;--line:#2a3444;--ink:#e9eef6;--dim:#8d99ab;--blue:#3d8bff;--red:#ff4d5e;--gold:#f2c14e;--green:#3ddc97;--mono:"JetBrains Mono",ui-monospace,Consolas,monospace;--disp:"Unbounded","Rubik",system-ui,sans-serif}
html{height:100%;box-sizing:border-box;background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.45 "Rubik",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
.app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);border-inline:1px solid var(--line)}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

.top{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.top::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:linear-gradient(90deg,var(--blue),var(--blue) 45%,var(--red) 55%,var(--red));background-size:220% 100%;animation:siren 2.4s ease-in-out infinite alternate}
@keyframes siren{from{background-position:0 0}to{background-position:100% 0}}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.shield{width:34px;height:38px;flex:none;display:grid;place-items:center;background:var(--gold);color:#1a1405;font:700 16px var(--disp);clip-path:polygon(50% 0,100% 14%,100% 58%,50% 100%,0 58%,0 14%)}
.brand b{display:block;font:700 14px/1.1 var(--disp);letter-spacing:.02em}
.brand small{color:var(--gold);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.res{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.pillr{display:flex;align-items:baseline;gap:5px;padding:5px 9px;border-radius:999px;background:var(--bg);border:1px solid var(--line);font:500 13px var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.pillr i{font-style:normal;color:var(--dim)}
.pillr em{font-style:normal;font-size:10px;color:var(--green)}
.pillr.rep i{color:var(--gold)}

main{flex:1;min-height:0;overflow-y:auto;padding:16px 16px 24px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 0 12px}
.sec-head h2,.sh-head h2{margin:0;font:700 17px/1.2 var(--disp);text-wrap:balance}
.sub{margin:18px 0 8px;font:600 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.muted{color:var(--dim);font-size:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.list{display:flex;flex-direction:column;gap:8px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);font-weight:600;font-size:13px;cursor:pointer}
.btn.primary{background:var(--blue);border-color:transparent;color:#fff}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.danger{color:var(--red);background:transparent}
.short .cost{color:#ffb3ba;text-decoration:line-through}
.why{margin:6px 0 0;color:var(--gold);font-size:12px}

.map{padding:10px;border-radius:16px;border:1px solid var(--line);background-color:#0a0e13;background-image:linear-gradient(90deg,rgba(242,193,78,.06) 1px,transparent 1px),linear-gradient(rgba(242,193,78,.06) 1px,transparent 1px);background-size:25% 25%}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tile{--c:var(--line);position:relative;aspect-ratio:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:6px 4px;border-radius:12px;cursor:pointer;border:1px solid color-mix(in srgb,var(--c) 40%,var(--line));background:linear-gradient(180deg,color-mix(in srgb,var(--c) 20%,var(--panel)),var(--panel))}
.tile .ic{font-size:clamp(22px,7vw,30px);line-height:1}
.tile .nm{font-size:10px;line-height:1.1;text-align:center;color:var(--dim);overflow-wrap:anywhere}
.tile .lv{position:absolute;top:5px;left:5px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--c);color:#0b0f14;font:700 11px/18px var(--mono);text-align:center}
.tile.empty{background:transparent;border:1px dashed var(--line)}
.tile.empty .plus{font:500 22px/1 var(--disp);color:var(--dim)}
.tile.locked{background:transparent;border:1px solid transparent;opacity:.4;cursor:default}
.tile .bar{position:absolute;left:8px;right:8px;bottom:6px}
.coin{position:absolute;top:-6px;right:-4px;padding:2px 6px;border-radius:999px;background:var(--gold);color:#1a1405;font:700 10px var(--mono);box-shadow:0 2px 10px rgba(242,193,78,.45)}
.coin.full{background:var(--green)}
.bar{display:block;height:5px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--gold);border-radius:3px}
.bar.big{height:8px;margin:8px 0}
.bar.big i{background:var(--c,var(--gold))}

.mapwrap{margin:0 -16px;background:radial-gradient(ellipse 70% 60% at 50% 55%,#1c2b3b,transparent 75%)}
.mapcv{display:block;cursor:pointer;touch-action:manipulation}
.maphint{margin:4px 0 0;text-align:center;color:var(--dim);font-size:12px}
.por{flex:none;display:block;width:44px;height:44px;border-radius:12px;border:1px solid var(--line)}
.por.sm{width:30px;height:30px;border-radius:8px}
.hire .por{width:52px;height:52px}
.rl .who{display:flex;align-items:center;gap:8px;color:var(--ink);text-align:left}
.summary{margin-top:14px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 16px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.kv span{color:var(--dim)}
.kv b{font-weight:500;text-align:right;font-variant-numeric:tabular-nums}
.tip{margin-bottom:14px;border-color:color-mix(in srgb,var(--blue) 45%,var(--line))}
.tip h3{margin:0 0 6px;font-size:14px}
.tip ol{margin:0 0 10px;padding-left:18px;color:var(--dim)}
.tip li{margin:2px 0}

.av{--c:var(--blue);flex:none;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 22%,var(--panel2));color:var(--c);border:1px solid color-mix(in srgb,var(--c) 45%,transparent);font:700 10px var(--mono);letter-spacing:.04em}
.off,.pick{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:var(--panel);border:1px solid var(--line);text-align:left}
.info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.info b{font-weight:500}
.info small{color:var(--dim);font-size:12px}
.xp{display:block;height:3px;margin-top:4px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden}
.xp i{display:block;height:100%;background:var(--green)}
.st{flex:none;font-size:11px;padding:3px 8px;border-radius:999px;border:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
.st.free{color:var(--green)}
.st.busy{color:var(--blue)}
.st.hurt{color:var(--red)}
.hires{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.hire{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.hire b{font-size:13px;font-weight:600}
.hire small{color:var(--dim);font-size:11px;line-height:1.3;flex:1}
.hire .btn{width:100%;padding:8px 6px}
@media (max-width:380px){.hires{grid-template-columns:1fr}}

.call{--c:var(--blue);position:relative;padding:12px 12px 12px 15px;border-radius:12px;background:var(--panel);border:1px solid var(--line);overflow:hidden}
.call::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.call.urgent{border-color:color-mix(in srgb,var(--red) 55%,var(--line))}
.call h3{margin:6px 0 8px;font-size:15px;font-weight:600;text-wrap:balance}
.call-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11px}
.chip{padding:2px 8px;border-radius:999px;background:color-mix(in srgb,var(--c) 20%,transparent);color:var(--c);font-weight:600;font-size:11px}
.chip.code{--c:var(--red);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.45}}
.tier{color:var(--gold);letter-spacing:1px}
.exp{margin-left:auto;color:var(--dim);font-variant-numeric:tabular-nums}
.meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0 0 10px}
.meta dt{color:var(--dim);font-size:11px}
.meta dd{margin:0;font:500 13px var(--mono);font-variant-numeric:tabular-nums}
.empty-note{color:var(--dim);text-align:center;padding:24px 0}

.tabs{display:grid;grid-template-columns:repeat(4,1fr);background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 4px 10px;background:none;border:0;color:var(--dim);font-size:11px;font-weight:500;cursor:pointer}
.tabs button span{font-size:18px;line-height:1}
.tabs button[aria-current="page"]{color:var(--ink)}
.tabs button[aria-current="page"]::before{content:"";position:absolute;top:0;left:25%;right:25%;height:2px;background:var(--gold);border-radius:0 0 2px 2px}
.nbadge{position:absolute;top:5px;left:calc(50% + 8px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font:700 10px/17px var(--mono)}

.sheet-bg{position:fixed;inset:0;z-index:10;display:flex;align-items:flex-end;justify-content:center;background:rgba(4,6,10,.62)}
.sheet{width:100%;max-width:480px;max-height:86%;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}}
.sh-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:12px}
.x{flex:none;width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);cursor:pointer}
.bld-hero{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.bld-hero .ic{font-size:40px}
.opt{display:flex;gap:10px;align-items:flex-start}
.opt .ic{font-size:28px;line-height:1.1}
.opt p{margin:2px 0 8px;color:var(--dim);font-size:12px}
.odds{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.odds>div{padding:10px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--line)}
.odds small{display:block;color:var(--dim);font-size:11px}
.odds b{font:700 20px var(--disp);font-variant-numeric:tabular-nums}
.odds.good b:last-child,.odds.good>div:last-child b{color:var(--green)}
.odds.mid>div:last-child b{color:var(--gold)}
.odds.bad>div:last-child b{color:var(--red)}
.pick{width:100%;cursor:pointer}
.pick.on{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 14%,var(--panel))}
.pick[disabled]{opacity:.4;cursor:not-allowed}
.pw{font:700 15px var(--mono);text-align:right}
.pw em{display:block;font:500 10px "Rubik",sans-serif;color:var(--gold);font-style:normal}
.row{display:flex;gap:8px;margin-top:12px}
.grow{flex:1}
.report{padding:14px;border-radius:12px;margin-bottom:10px;background:color-mix(in srgb,var(--green) 14%,var(--bg));border:1px solid color-mix(in srgb,var(--green) 40%,var(--line))}
.report.fail{background:color-mix(in srgb,var(--red) 14%,var(--bg));border-color:color-mix(in srgb,var(--red) 40%,var(--line))}
.report small{color:var(--dim);font:600 11px var(--mono);letter-spacing:.1em;text-transform:uppercase}
.report h2{margin:4px 0;font:700 20px var(--disp)}
.report p{margin:0;color:var(--dim)}
.rl{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:6px 0;border-bottom:1px solid var(--line)}
.rl span{color:var(--dim);text-align:right}
.up{color:var(--green);font-style:normal}
.hurtx{color:var(--red);font-style:normal}

.speedbar{display:flex;align-items:center;gap:5px;padding:6px 16px;background:var(--panel);border-bottom:1px solid var(--line);font-size:12px;color:var(--dim)}
.speedbar .lbl2{margin-right:auto;display:flex;align-items:center;gap:6px;letter-spacing:.08em;text-transform:uppercase;font-size:10px}
.speedbar .lbl2 b{font:600 12px var(--mono);letter-spacing:0;text-transform:none;color:var(--ink)}
.spd{min-width:36px;padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--dim);font:600 12px var(--mono);cursor:pointer}
.spd[aria-pressed="true"]{background:var(--blue);border-color:transparent;color:#fff}
.speedbar.paused{background:color-mix(in srgb,var(--gold) 12%,var(--panel))}
.speedbar.paused .lbl2 b{color:var(--gold)}
.speedbar.paused .spd[data-speed="0"]{background:var(--gold);color:#1a1405}
.mapwrap{position:relative}
.rotbar{position:absolute;right:16px;top:8px;z-index:2;display:flex;align-items:center;gap:6px}
.rotbar button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:rgba(22,28,38,.85);font-size:18px;cursor:pointer}
.rotbar span{padding:4px 8px;border-radius:8px;background:rgba(22,28,38,.85);border:1px solid var(--line);font-size:11px;color:var(--dim)}
.pausemark{position:absolute;left:16px;top:8px;z-index:2;padding:4px 10px;border-radius:8px;background:var(--gold);color:#1a1405;font:700 11px var(--mono);letter-spacing:.1em}
.mayor{display:flex;gap:12px;align-items:center;margin-bottom:8px}
.mayor .info{gap:4px}
.mayor .chip{align-self:flex-start}
.mname{font:700 16px var(--disp)}
.bigbar{display:block;height:8px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden;margin:2px 0 4px}
.bigbar i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--gold),var(--green))}
.order h3{margin:6px 0 4px;font-size:15px;font-weight:600}
.dists{display:flex;flex-direction:column;gap:6px;margin-bottom:6px}
.dist{display:grid;grid-template-columns:minmax(0,120px) 1fr 40px;gap:8px;align-items:center;font-size:13px}
.dist b{font-family:var(--mono);text-align:right}
.cbar{height:6px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
.cbar i{display:block;height:100%}
.cand2{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.cand2 .info{flex:1;min-width:160px}
.cand2.on{border-color:var(--blue)}
.nego{flex-direction:column;align-items:flex-start;text-align:left;gap:3px}
.nego small{color:var(--dim);font-weight:400}
.ast{display:flex;gap:10px;align-items:flex-start}
.ast.off{opacity:.6}
.ast .row{margin-top:6px}
.row.wrap{flex-wrap:wrap}
.row.wrap .btn.sm{margin-left:0}
.bq{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.bq span{display:inline-flex;align-items:center;gap:4px;padding:3px 4px 3px 9px;border-radius:999px;background:var(--bg);border:1px solid var(--line);font-size:11px}
.xs{width:20px;height:20px;border-radius:50%;border:0;background:var(--panel2);font-size:10px;cursor:pointer}
.alog{display:flex;flex-direction:column;gap:4px}
.al{display:flex;gap:8px;font-size:12px;padding:6px 8px;border-radius:8px;background:var(--bg);border-left:3px solid var(--line);color:var(--dim)}
.al.ok{border-left-color:var(--green)}
.al.bad{border-left-color:var(--red);color:#ffb3ba}
.rule{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--dim);font-size:12px;cursor:pointer}
.seg button.on{background:var(--blue);border-color:transparent;color:#fff}
#bootfail{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(4,6,10,.8)}
#bootfail .card{max-width:420px}
#bootfail h2{margin:0 0 8px;font:700 18px var(--disp)}
#bootfail pre{white-space:pre-wrap;font:12px var(--mono);color:#ffb3ba;background:var(--bg);padding:8px;border-radius:8px;max-height:120px;overflow:auto}
.off{width:100%;cursor:pointer}
.meters{display:flex;gap:4px;margin-top:5px;max-width:160px}
.mt{flex:1;display:block;height:4px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden}
.mt i{display:block;height:100%}
.mor{background:var(--green)}
.fat{background:var(--gold)}
.legend{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:8px 0 0;color:var(--dim);font-size:11px}
.lg{display:inline-block;width:14px;height:4px;border-radius:2px}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.tchip{font-size:10px;padding:1px 6px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.tchip.g{color:var(--green);border-color:color-mix(in srgb,var(--green) 40%,var(--line))}
.tchip.b{color:#ff8c96;border-color:color-mix(in srgb,var(--red) 40%,var(--line))}
.spb{font-style:normal;font-size:10px;font-weight:700;padding:0 5px;border-radius:8px;background:var(--blue);color:#fff;vertical-align:1px}
.st.rest{color:var(--gold)}
.evc{display:flex;align-items:center;gap:10px;width:100%;padding:10px;border-radius:12px;text-align:left;cursor:pointer;background:color-mix(in srgb,var(--blue) 12%,var(--panel));border:1px solid color-mix(in srgb,var(--blue) 45%,var(--line))}
.evc small{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.evx{display:grid;place-items:center;font-size:20px;background:var(--panel2)}
.cand{display:flex;align-items:center;gap:10px}
.cand .btn{flex:none;padding:8px 10px}
.por.xl{width:96px;height:96px;border-radius:16px}
.dos-top{display:flex;gap:12px;align-items:flex-start;margin-bottom:6px}
.dos-kv{flex:1;min-width:0}
.dos-kv .kv{padding:5px 0}
.kv{align-items:center}
.kv b{margin-left:auto}
.kv b.good{color:var(--green)}
.kv b.bad{color:#ff8c96}
.bio{color:var(--dim);font-size:13px;margin:6px 0 10px}
.traits{display:flex;flex-direction:column;gap:4px;margin-bottom:4px}
.trait{font-size:12px;padding:6px 10px;border-radius:10px;background:var(--bg);border-left:3px solid var(--green)}
.trait.b{border-left-color:var(--red)}
.skills{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.skr{display:grid;grid-template-columns:minmax(0,118px) 1fr 20px 28px;align-items:center;gap:8px;font-size:13px}
.sbar{height:6px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
.sbar i{display:block;height:100%;background:var(--blue)}
.skr b{font-family:var(--mono);text-align:right}
.plus{width:28px;height:24px;border-radius:8px;border:1px solid var(--blue);background:color-mix(in srgb,var(--blue) 25%,transparent);font-weight:700;cursor:pointer}
.powers{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px;font-size:12px;color:var(--dim)}
.powers span{padding:4px 8px;border-radius:8px;background:var(--bg);border:1px solid var(--line)}
.powers b{color:var(--ink);font-family:var(--mono)}
.btn.sm{padding:5px 9px;font-size:12px;margin-left:8px;flex:none}
.gearl{margin:4px 0 8px}
.gi{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:10px;background:var(--bg);border:1px solid var(--line)}
.gi small{display:block;color:var(--dim);font-size:11px}
.stats4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-bottom:4px}
.stats4 div{padding:8px 4px;border-radius:10px;background:var(--bg);border:1px solid var(--line);text-align:center}
.stats4 b{display:block;font:700 16px var(--mono)}
.stats4 span{font-size:10px;color:var(--dim)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.acts .danger{grid-column:1/-1}
.evbody{display:flex;gap:10px;justify-content:center;margin-bottom:10px}

const HQ_COST = [0, 0, 600, 1800, 4200, 8500], HQ_REP = [0, 0, 15, 50, 120, 250];
const HQ_UNLOCK = ['', '', 'Автопарк, Оружейная, Спецназ и штурмы', 'Криминалистика, Академия, четвёртый вызов', 'ещё кварталы и отряд из 4 человек', 'весь город и самые опасные дела'];
const RANKS = [[0, 'Сержант'], [15, 'Лейтенант'], [50, 'Капитан'], [120, 'Майор'], [250, 'Подполковник'], [400, 'Полковник'], [700, 'Комиссар']];
const ORDER = [5, 6, 9, 10, 1, 2, 4, 8, 7, 11, 13, 14, 0, 3, 12, 15];
const FM = ['Иван', 'Олег', 'Сергей', 'Дмитрий', 'Павел', 'Артём', 'Игорь', 'Никита', 'Роман', 'Глеб', 'Тимур', 'Андрей'];
const FF = ['Марина', 'Анна', 'Ольга', 'Ксения', 'Елена', 'Вера', 'Алина', 'Дарья'];
const LN = ['Громов', 'Соколов', 'Белов', 'Орлов', 'Кузнецов', 'Волков', 'Лебедев', 'Морозов', 'Зайцев', 'Титов', 'Панов', 'Жуков', 'Карпов', 'Рябов'];

/* ---------- состояние и формулы ---------- */
let S;
/* игровые часы: всё считается в игровом времени, которое идёт со скоростью темпа */
const SPEEDS = [0, .5, 1, 2, 3], SPEED_LBL = ['Пауза', '×½', '×1', '×2', '×3'];
const gnow = () => (S && S.gt) || Date.now();
let vt = 0, vtLast = performance.now();
function advanceVT() {
  const pn = performance.now();
  vt += Math.min(100, pn - vtLast) * SPEEDS[S.speed];
  vtLast = pn;
  return vt;
}
const hq = () => S.plots[5].lv;
const plotsOf = t => S.plots.filter(p => p && p.type === t);
const sumLv = t => plotsOf(t).reduce((a, p) => a + p.lv, 0);
const maxCount = t => t === 'biz' ? hq() : t === 'dorm' ? 1 + Math.floor(hq() / 2) : 1;
const capOff = () => 2 + hq() + 2 * sumLv('dorm');
const squadMax = () => 2 + Math.floor(hq() / 2);
const maxLv = () => 3 + 2 * sumLv('academy');
const durMult = () => Math.max(.6, 1 - .08 * sumLv('garage'));
const rewMult = () => 1 + .15 * sumLv('lab');
const armMult = () => 1 + .1 * sumLv('armory');
const bizRate = lv => lv ? (1.5 * lv + .5) * taxMult() : 0;
const bizCap = lv => Math.round(bizRate(lv) * 60);
const income = () => hq() + plotsOf('biz').reduce((a, p) => a + bizRate(p.lv), 0);
const unlocked = () => new Set(ORDER.slice(0, Math.min(16, 6 + 2 * hq())));
const lockLv = i => Math.floor((ORDER.indexOf(i) - 6) / 2) + 1;
const cost = (t, to) => t === 'hq' ? HQ_COST[to] : Math.round(B[t].k * to ** 1.7 / 10) * 10;
const btime = (t, to) => t === 'hq' ? 8 * to : 3 + 3 * to;
const buildBusy = () => S.plots.some(p => p && p.build);
const stored = p => p && p.type === 'biz' ? Math.min(bizCap(p.lv), (gnow() - p.t) / 1000 * bizRate(p.lv)) : 0;
const need = lv => 15 * lv;
const chance = (P, D) => clamp(1 / (1 + Math.exp(-4 * (P / D - .85))), .03, .97);
const rankOf = rep => RANKS.filter(r => rep >= r[0]).pop()[1];
const boardSize = () => 3 + (hq() >= 3 ? 1 : 0);

function effTxt(t, lv) {
  switch (t) {
    case 'hq': return `+${lv} ₽/с, +${lv} к штату, отряд до ${2 + Math.floor(lv / 2)} чел.`;
    case 'biz': return `${bizRate(lv)} ₽/с, касса ${bizCap(lv)} ₽`;
    case 'dorm': return `+${2 * lv} мест в штате`;
    case 'garage': return `вызовы быстрее на ${8 * lv}%`;
    case 'armory': return `+${10 * lv}% к силе сотрудников`;
    case 'lab': return `+${15 * lv}% к наградам`;
    case 'academy': return `предел уровня сотрудников +${2 * lv}`;
  }
}

function genMission(easy) {
  const types = ['patrol', 'invest'].concat(hq() >= 2 ? ['assault'] : []);
  const type = easy ? 'patrol' : pick(types);
  const tier = easy ? 1 : Math.max(1, hq() + rint(-1, 1));
  const urgent = !easy && Math.random() < .15;
  return {
    id: uid(), type, name: pick(MT[type].names), tier, urgent,
    diff: Math.round(14 * tier ** 1.3 * MT[type].mult),
    baseDur: (6 + 5 * tier) * (urgent ? .8 : 1),
    money: Math.round((50 + 45 * tier) * (urgent ? 1.8 : 1) * rnd(.9, 1.1)),
    rep: Math.round(2 * tier * (urgent ? 1.5 : 1)),
    xp: 8 * tier,
    born: gnow(),
    exp: gnow() + (urgent ? 30 : rint(50, 80)) * 1000
  };
}

function fresh() {
  const now = gnow(), plots = Array(16).fill(null);
  plots[5] = {type: 'hq', lv: 1};
  plots[6] = {type: 'biz', lv: 1, t: now - 20000};
  S = {v: 3, money: 250, rep: 0, plots, officers: [], missions: [], reports: [], last: now, nextCall: now + 5000, call: null, voice: true, tab: 'city', tip: true,
    rel: {}, events: [], nextEvent: now + 35000, nextPay: now + 60000, candT: now + 120000, dirty: 0,
    gt: now, speed: 2, prevSpeed: 2, lastReal: Date.now(), rot: 0};
  S.officers.push(mkOff('patrol'), mkOff('patrol'));
  S.cands = genCands();
  initCity(); initAst();
}
function migrate3() {
  const now = gnow();
  S.officers.forEach(upgradeOff);
  Object.assign(S, {v: 3, rel: {}, events: [], nextEvent: now + 30000, nextPay: now + 60000, candT: now + 120000, dirty: 0});
  S.cands = genCands();
}

function load() {
  try {
    const d = JSON.parse(localStorage.getItem('uchastok7'));
    if (d && [1, 2, 3].includes(d.v) && Array.isArray(d.plots) && d.plots.length === 16) {
      if (d.v === 1) { d.missions = []; d.officers.forEach(o => o.busy = null); d.v = 2; d.call = null; d.nextCall = gnow() + 4000; d.voice = true; }
      if (!d.gt) { d.gt = Date.now(); d.lastReal = d.last || Date.now(); d.speed = 2; d.prevSpeed = 2; d.rot = 0; }
      S = d;
      if (S.v === 2) migrate3();
      if (!S.city) initCity();
      if (!S.ast) initAst();
      if (S.call) {
        for (const q of ['scene', 'route']) S.call.lines[q] ||= callFallback[S.call.kind]?.[q] || 'Не могу сейчас уточнить.';
        if (S.call.state === 'talk' && !S.call.talkEnd) S.call.talkEnd = gnow() + 60000;
      }
      return;
    }
  } catch (e) {}
  fresh();
}
function save() { try { localStorage.setItem('uchastok7', JSON.stringify(S)); } catch (e) {} }

function toast(msg) {
  const box = $('#toasts'), el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg; box.appendChild(el);
  while (box.children.length > 3) box.firstChild.remove();
  setTimeout(() => el.remove(), 2600);
}

/* ---------- действия ---------- */
function collect(i) {
  const p = S.plots[i], v = Math.floor(stored(p));
  if (v < 1) return false;
  S.money += v; p.t = gnow();
  const [lx, ly] = lotXY(i);
  floatText(lx + .5, ly + .5, lotH[i] + .3, `+${fmt(v)} ₽`, '#f2c14e');
  if (S.tab !== 'city') toast(`+${fmt(v)} ₽ налогов`); save(); updateTop(); updateDyn();
  return true;
}

/* quiet — вызов от завхоза: без всплывающих ошибок, с учётом неприкосновенного запаса; возвращает true или причину */
function build(i, type, quiet) {
  const b = B[type], c = cost(type, 1);
  if (S.plots[i] || !unlocked().has(i)) return 'rule';
  if (hq() < b.hq || plotsOf(type).length >= maxCount(type)) return 'rule';
  if (buildBusy()) return quiet ? 'busy' : toast('Бригада занята другой стройкой');
  if (S.money < c + (quiet ? S.rules.zavReserve : 0)) return quiet ? 'money' : toast(`Не хватает ${fmt(c - S.money)} ₽`);
  const now = gnow();
  S.money -= c;
  S.plots[i] = {type, lv: 0, t: now, build: {start: now, end: now + btime(type, 1) * 1000, to: 1}};
  toast(`Стройка началась: ${b.name}`);
  if (!quiet) closeSheet();
  render(); save();
  return true;
}

function upgrade(i, quiet) {
  const p = S.plots[i];
  if (!p) return 'rule';
  const b = B[p.type], to = p.lv + 1, c = cost(p.type, to);
  if (p.build || to > b.max) return 'rule';
  if (p.type !== 'hq' && to > hq()) return quiet ? 'rule' : toast(`Сначала повысь Участок до ур. ${to}`);
  if (p.type === 'hq' && S.rep < HQ_REP[to]) return quiet ? 'wait' : toast(`Нужно ${HQ_REP[to]} ★ доверия`);
  if (buildBusy()) return quiet ? 'busy' : toast('Бригада занята другой стройкой');
  if (S.money < c + (quiet ? S.rules.zavReserve : 0)) return quiet ? 'money' : toast(`Не хватает ${fmt(c - S.money)} ₽`);
  if (p.type === 'biz') collect(i);
  const now = gnow();
  S.money -= c;
  p.build = {start: now, end: now + btime(p.type, to) * 1000, to};
  if (quiet) toast(`Завхоз начал улучшение: ${b.name}`);
  render(); if (!quiet) renderSheet(); save();
  return true;
}

function missionApproach(m) { return APPROACH[m.approach] || APPROACH.standard; }
function missionChance(m, sp) {
  const ap = missionApproach(m);
  return clamp(chance(sp.P, m.diff) * (m.vague ? .9 : 1) + sp.luck + ap.chance + Math.min(5, m.intel || 0) * .012, .03, .97);
}
function missionDuration(m) { return m.baseDur * durMult() * missionApproach(m).time; }
function sendSquad(m, ids) {
  const squad = ids.map(oById).filter(o => o && avail(o));
  if (!squad.length || m.start) return false;
  const ap = missionApproach(m);
  if (S.money < ap.cost) { toast(`Для поддержки нужно ${ap.cost} ₽`); return false; }
  const sp = squadPower(squad.map(o => o.id), m.type), now = gnow();
  S.money -= ap.cost;
  m.spent = (m.spent || 0) + ap.cost;
  m.start = now; m.end = now + missionDuration(m) * 1000; m.esc = null;
  m.squad = squad.map(o => o.id); m.chance = missionChance(m, sp);
  squad.forEach(o => o.busy = m.id);
  return true;
}
function dispatch(m) {
  if (!sendSquad(m, [...sel])) return;
  toast('Отряд выехал на вызов');
  closeSheet(); render(); save();
}

function resolve(m) {
  const ap = missionApproach(m);
  if (m.fake) {
    const sq = S.officers.filter(o => m.squad.includes(o.id));
    sq.forEach(o => { o.busy = null; o.fat += 5; o.mor -= 3; o.st.calls++; });
    normalizeStaff();
    const rep = m.fake === 'fake' ? -1 : 0;
    S.rep = Math.max(0, S.rep + rep);
    S.reports.push({fake: true, ok: false, type: m.type, name: m.name, money: 0, rep, spent: m.spent || 0,
      title: m.fake === 'fake' ? 'Ложный вызов' : 'Не по профилю',
      note: m.fake === 'fake' ? `По адресу «${m.addr}» никого. Наряд катался впустую — это были шутники.` : `На месте помощь нужна была не полиции: наряд сам вызвал ${SERV_TO[m.fake]}.`,
      lines: sq.map(o => ({id: o.id, name: o.name, gain: 0, up: 0, lv: o.lv, hurt: false}))});
    floatText(rc(2), rc(2), 1.2, '✖ Впустую', '#ff4d5e');
    S.missions = S.missions.filter(x => x !== m);
    return;
  }
  const ok = Math.random() < m.chance, now = gnow(), rank0 = rankOf(S.rep);
  const money = Math.round(m.money * (ok ? rewMult() : .25)), sq = S.officers.filter(o => m.squad.includes(o.id));
  const rep = ok ? m.rep + sq.filter(o => hasT(o, 'honest')).length : 0;
  S.money += money; S.rep += rep;
  cityOnResolve(m, ok);
  for (let i = 0; i < sq.length; i++) for (let j = i + 1; j < sq.length; j++) relAdd(sq[i].id, sq[j].id, ok ? 4 : -3);
  const lines = sq.map(o => {
    o.busy = null;
    const gain = ok ? m.xp : Math.round(m.xp / 3);
    let up = 0;
    if (o.lv < maxLv()) {
      o.xp += gain;
      while (o.lv < maxLv() && o.xp >= need(o.lv)) { o.xp -= need(o.lv); o.lv++; up++; }
      o.sp = (o.sp || 0) + up * 2;
    }
    o.st.calls++; if (ok) o.st.ok++;
    o.fat += (10 + 4 * m.tier) * (hasT(o, 'tough') ? .6 : 1) * (o.gear.a === 'heavy' ? 1.2 : 1);
    o.mor += ok ? 5 : -8 * (hasT(o, 'coward') ? 1.5 : 1);
    const hurt = Math.random() < (ok ? .1 : .5) * ap.injury * (m.radioInjury || 1) * (m.safeGuide ? .82 : 1) * (gearOf(o, 'a').inj || 1) * (hasT(o, 'talker') ? .7 : 1);
    if (hurt) {
      o.hurt = now + (ok ? 15000 : 25000) * (hasT(o, 'tough') ? .6 : 1); o.st.hurt++; o.mor -= 12;
      const pr = o.partner && oById(o.partner);
      if (pr) pr.mor -= 5;
    }
    if (o.st.calls >= 25 && !hasT(o, 'veteran')) { o.traits.push('veteran'); toast(`${o.name} получает черту «Ветеран»`); }
    if (ok && m.tier >= 2 && Math.random() < .15) queueEvent('hero', o, null, {mname: m.name});
    if (hasT(o, 'hothead') && Math.random() < (o.gear.g === 'cam' ? .1 : .3)) queueEvent('complaint', o);
    return {id: o.id, name: o.name, gain, up, lv: o.lv, hurt};
  });
  normalizeStaff();
  floatText(rc(2), rc(2), 1.2, ok ? '✔ Успех' : '✖ Провал', ok ? '#3ddc97' : '#ff4d5e');
  S.reports.push({ok, name: m.name, type: m.type, money, rep, spent: m.spent || 0, lines, approach: m.approach || 'standard', radioChoice: m.radioChoice || 'plan', intel: m.intel || 0, safeGuide: !!m.safeGuide});
  S.missions = S.missions.filter(x => x !== m);
  const rank1 = rankOf(S.rep);
  if (rank1 !== rank0) toast(`Новое звание: ${rank1}`);
}

/* ---------- такт игры ---------- */
function tick() {
  const rn = Date.now(), rdt = clamp(rn - (S.lastReal || rn), 0, 3600000) * SPEEDS[S.speed];
  S.lastReal = rn;
  S.gt += rdt;
  const now = S.gt, dt = rdt / 1000;
  let changed = false;
  S.money += hq() * dt;
  if (staffTick(now, dt)) changed = true;
  if (cityTick(now, dt)) changed = true;
  if (astTick(now)) changed = true;

  S.plots.forEach(p => {
    if (!p || !p.build || now < p.build.end) return;
    const wasNew = p.lv === 0;
    p.lv = p.build.to; delete p.build;
    if (wasNew) p.t = now;
    toast(p.type === 'hq' ? `Участок ур. ${p.lv}! Открыто: ${HQ_UNLOCK[p.lv]}` : `${B[p.type].name}: ур. ${p.lv} готов`);
    changed = true;
  });
  for (const m of [...S.missions]) {
    if (m.start && !m.fake && !m.radioDone && !m.radioPending && now >= m.start + (m.end - m.start) * .45) {
      m.radioPending = true; m.radioOriginalEnd = m.end; m.radioDeadline = now + 30000; m.end = Math.max(m.end, m.radioDeadline + 5000);
      toast(`Рация: наряд на месте — «${m.name}». Нужен приказ`); changed = true;
    }
    if (m.radioPending && now >= m.radioDeadline) { m.radioPending = false; m.radioDone = true; m.radioChoice = 'plan'; m.end = Math.max(now + 3000, m.radioOriginalEnd || m.end); changed = true; }
    if (m.start && now >= m.end) { resolve(m); changed = true; }
    else if (!m.start && now >= m.exp) {
      S.missions = S.missions.filter(x => x !== m); changed = true;
      cityOnExpire(m);
      if (!m.fake) { S.rep = Math.max(0, S.rep - 2); toast(`Наряд так и не приехал: «${m.name}». Доверие −2`); }
      else toast(`Вызов закрыт: «${m.name}»`);
    }
  }
  if (!S.call && now >= S.nextCall) { S.call = newCall(); changed = true; }
  if (S.call && S.call.state === 'ring') {
    if (now >= S.call.ringEnd) {
      if (S.call.kind === 'police') { S.rep = Math.max(0, S.rep - 1); toast('Пропущен звонок на 102. Доверие −1'); }
      else toast('Звонящий повесил трубку');
      S.call = null; S.nextCall = now + rint(8, 14) * 1000; changed = true;
    } else if (now - lastRing > 2800) { lastRing = now; ringSound(); }
  }
  if (S.call && S.call.state === 'talk' && now >= S.call.talkEnd) { expireCall(S.call); changed = true; }
  S.officers.forEach(o => { if (o.hurt && now >= o.hurt) { o.hurt = 0; changed = true; } });

  if (changed) { render(); if (sheetCtx && sheetCtx.kind !== 'report' && sheetCtx.kind !== 'call') renderSheet(); save(); }
  else { updateTop(); updateDyn(); }
  if (S.reports.length && !sheetCtx) { sheetCtx = {kind: 'report'}; renderSheet(); }
}

/* ---------- изометрическая карта ---------- */
const M0 = .6, RW = .5, LW = 1, WORLD = M0 * 2 + RW * 5 + LW * 4, HZ = .82;
const roadS = k => M0 + k * (RW + LW);
const rc = k => roadS(k) + RW / 2;
const lotS = a => M0 + RW + a * (RW + LW);
const lotXY = i => [lotS(i % 4), lotS(Math.floor(i / 4))];
const mapCv = document.createElement('canvas');
mapCv.className = 'mapcv';
mapCv.setAttribute('aria-label', 'Карта города');
const mc = mapCv.getContext('2d');
let MK = 28, MOX = 0, MOY = 0, MW = 0, MH = 0, rafOn = false, markersScr = [], fx = [];
const lotH = Array(16).fill(1), lotHull = Array(16).fill(null);
/* Pr — проекция уже повёрнутых координат, P — мировых (с учётом ракурса камеры) */
const Pr = (x, y, z = 0) => [MOX + (x - y) * MK, MOY + (x + y) * MK / 2 - z * MK * HZ];
function rot(x, y) {
  const c = WORLD / 2, dx = x - c, dy = y - c, r = (S && S.rot) || 0;

  let h = `<div class="sh-head"><div><span class="muted">Линия 102 · ${c.phone}</span><h2>Разговор с заявителем</h2></div>
    <button type="button" class="x" data-voice aria-label="${S.voice ? 'Выключить голос' : 'Включить голос'}">${S.voice ? '🔊' : '🔇'}</button></div>`;
  if (S.voice && !ruVoices.length) h += '<p class="muted" style="margin:-6px 0 8px">Русский голос в браузере не найден — звонки идут текстом.</p>';
  h += `<div class="call-clock${c.talkEnd - gnow() < 16000 ? ' hot' : ''}"><span>${c.urgent ? 'Срочный звонок' : 'Заявитель ждёт решения'} · вопросы отнимают время</span><b data-end="${c.talkEnd}"></b></div>`;
  h += '<div class="chat" id="chat">' + c.log.map((l, i) => `<div class="msg ${l.who}"${busy && i === c.log.length - 1 ? ' id="typing"' : ''}>${fmtMsg(l.text)}</div>`).join('') + '</div>';
  const bogus = c.kind === 'fake' && c.vague;
  h += `<div class="case">
    <div><span>Адрес</span><b>${k.addr ? esc(c.addrText) : '—'}</b></div>
    <div><span>Район</span><b>${k.addr && !bogus ? distAt(c.loc.x, c.loc.y).n : '—'}</b></div>
    <div><span>Суть</span><b>${k.type ? MT[c.type].name : '—'}</b></div>
    <div><span>Опасность</span><b>${k.diff ? 'нужна сила ≈ ' + callDiff(c) : '—'}</b></div></div>`;
  if (c.urgent) h += '<p class="why" style="margin:0 0 8px">Звонящий говорит, что всё срочно. Долгие расспросы могут дорого стоить.</p>';
  h += `<p class="call-hint">Каждый вопрос: −4 сек. Сведения помогут наряду. Адрес нужен для отправки полиции.</p>`;
  h += '<div class="qs">' + QKEYS.map(q => `<button type="button" class="q" data-ask="${q}" ${busy || c.asked.includes(q) ? 'disabled' : ''}>${QLABEL[q]}</button>`).join('') + '</div>';
  h += `<h3 class="sub">Что сказать заявителю</h3><div class="call-actions">${Object.entries(GUIDE).map(([id, a]) => `<button type="button" class="q${c.guide === id ? ' on' : ''}" data-guide="${id}" ${busy || c.guide ? 'disabled' : ''}><b>${a.name}</b><small>${a.hint}</small></button>`).join('')}</div>`;
  h += `<div class="decide">
    <button type="button" class="btn primary" data-decide="send" ${busy || !k.addr ? 'disabled' : ''}>🚓 Принять и отправить наряд</button>
    <button type="button" class="btn" data-decide="ems" ${busy ? 'disabled' : ''}>🚑 Передать в скорую</button>
    <button type="button" class="btn" data-decide="fire" ${busy ? 'disabled' : ''}>🚒 Передать в МЧС</button>
    <button type="button" class="btn danger" data-decide="drop" ${busy ? 'disabled' : ''}>Сбросить звонок</button></div>`;
  if (!k.addr) h += '<p class="muted" style="margin:8px 0 0">Чтобы отправить наряд, узнай адрес.</p>';
  return h;
}
function radioOrder(m, choice) {
  const r = RADIO[choice];
  if (!m || !m.start || !m.radioPending || !r || S.money < r.cost) return;
  S.money -= r.cost;
  m.spent = (m.spent || 0) + r.cost;
  m.chance = clamp(m.chance + r.chance, .03, .97);
  m.end = gnow() + Math.max(3000, (m.radioOriginalEnd || m.end) - gnow()) * r.time;
  m.radioInjury = r.injury;
  m.radioChoice = choice; m.radioDone = true; m.radioPending = false;
  toast(`Приказ наряду: ${r.name.toLowerCase()}`);
  closeSheet(); render(); save();
}
function afterCallRender() {
  const ch = $('#chat');
  if (!ch) return;
  ch.scrollTop = ch.scrollHeight;
  const el = $('#typing');
  if (!typing || !el) return;
  const text = typing.text;
  clearInterval(typer);
  let i = 0;
  el.textContent = '';
  typer = setInterval(() => {
    i = Math.min(text.length, i + 2);
    el.innerHTML = fmtMsg(text.slice(0, i)); ch.scrollTop = ch.scrollHeight;
    if (i >= text.length) { clearInterval(typer); typer = null; typing = null; renderSheet(); }
  }, 26);
}

function avail(o) { const now = gnow(); return !o.busy && !(o.hurt > now) && !(o.rest > now) && !o.exh; }
function eff(o, type) {
  const w = SKW[type];
  let s = 0;
  for (const k in w) s += o.sk[k] * w[k];
  let m = 3 * s * (1 + .06 * o.rank) * armMult();
  if (type === 'assault') { if (hasT(o, 'sharp')) m *= 1.2; if (hasT(o, 'coward')) m *= .8; }
  if (type === 'patrol' && hasT(o, 'talker')) m *= 1.2;
  if (type === 'invest' && hasT(o, 'nose')) m *= 1.2;
  if (type !== 'invest' && hasT(o, 'hothead')) m *= 1.1;
  if (hasT(o, 'veteran')) m *= 1.1;
  for (const sl in SLOT) { const g = gearOf(o, sl); if (g.m) m *= (g.m[type] || 1) * (g.m.all || 1); }
  if (o.fat >= 70) m *= .8;
  m *= o.mor < 30 ? .85 : o.mor >= 80 ? 1.05 : 1;
  return Math.round(m);
}
function squadPower(ids, type) {
  const sq = ids.map(oById).filter(Boolean), notes = [];
  let mult = 1;
  for (let i = 0; i < sq.length; i++) for (let j = i + 1; j < sq.length; j++) {
    const a = sq[i], b = sq[j], r = relOf(a.id, b.id);
    if (a.partner === b.id) { const bn = r >= 50 ? .2 : .1; mult += bn; notes.push(`Напарники ${short(a)} и ${short(b)}: +${bn * 100}%`); }
    else if (r <= -30) { mult -= .1; notes.push(`${short(a)} и ${short(b)} не ладят: −10%`); }
    else if (r >= 60) { mult += .05; notes.push(`${short(a)} и ${short(b)} сработались: +5%`); }
  }
  return {P: Math.round(sq.reduce((a, o) => a + eff(o, type), 0) * mult), notes, luck: sq.some(o => hasT(o, 'lucky')) ? .05 : 0};
}

const eventValid = e => (!e.oid || oById(e.oid)) && (!e.bid || oById(e.bid));
function queueEvent(kind, o, b, extra = {}) {
  S.events = S.events || [];
  if (S.events.length >= 8) return;
  if (o && S.events.some(e => e.kind === kind && e.oid === o.id)) return;
  if (!o && S.events.some(e => e.kind === kind)) return;
  const e = {id: uid(), kind, oid: o ? o.id : null, bid: b ? b.id : null, t0: gnow(), ...extra};
  e.text = EV[kind].text(o, b, e);
  S.events.push(e);
  toast(EV[kind].narr ? `📋 ${EV[kind].title}${o ? ': ' + o.name : ''}` : `💬 ${o.name} просит разговора`);
}
function ambientEvent() {
  const opts = [];
  for (const o of S.officers) {
    if (o.busy) continue;
    opts.push(['bonus', o, null, hasT(o, 'greedy') ? 3 : 1], ['dayoff', o, null, .8]);
    if (hasT(o, 'drinker')) opts.push(['drunk', o, null, 2]);
    if ((hasT(o, 'greedy') || o.cor > 40) && !hasT(o, 'honest')) opts.push(['bribe', o, null, 1 + o.cor / 30]);
    if (!promoWhy(o)) opts.push(['promo', o, null, 2]);
    for (const b of S.officers) {
      if (b.id === o.id) continue;
      const r = relOf(o.id, b.id);
      if (r <= -20 || (hasT(o, 'hothead') && Math.random() < .3)) opts.push(['conflict', o, b, 1.5]);
      if (r >= 40 && !o.partner && !b.partner) opts.push(['pairup', o, b, 1.5]);
    }
  }
  if (!opts.length) return;
  let x = Math.random() * opts.reduce((a, v) => a + v[3], 0);
  for (const v of opts) { x -= v[3]; if (x <= 0) return queueEvent(v[0], v[1], v[2]); }
}
function staffTick(now, dt) {
  let ch = false;
  S.events = S.events || [];
  for (const o of [...S.officers]) {
    if (!o.busy) o.fat -= dt * (o.rest > now ? 3 : .7);
    if (o.exh && o.fat < 50) { o.exh = false; ch = true; }
    o.mor += ((hasT(o, 'drinker') ? 45 : 60) - o.mor) * Math.min(1, .004 * dt);
    if (hasT(o, 'greedy')) o.cor += .02 * dt;
    if (o.mor < 30) o.cor += .01 * dt;
    if (o.rest && now >= o.rest) {
      if (o.restKind === 'susp') {
        if (o.cor >= 50) { o.warn++; o.cor = 0; S.rep += 2; toast(`Проверка: ${o.name} — выявлены нарушения. Выговор, доверие +2`); if (o.warn >= 4) queueEvent('fireWarn', o); }
        else { o.mor -= 10; toast(`Проверка: ${o.name} — нарушений нет. Сотрудник обижен недоверием`); }
      } else toast(`${o.name} вернул${o.fem ? 'ась' : 'ся'} на службу`);
      o.rest = 0; o.restKind = ''; ch = true;
    }
    if (o.mor < 15 && !S.events.some(e => e.kind === 'quit' && e.oid === o.id)) { queueEvent('quit', o); ch = true; }
  }
  normalizeStaff();
  if (now >= S.nextPay) { payday(); S.nextPay = now + 60000; normalizeStaff(); ch = true; }
  if (now >= S.nextEvent) { ambientEvent(); S.nextEvent = now + rint(40, 70) * 1000; ch = true; }
  if ((S.dirty || 0) >= 2 && !S.events.some(e => e.kind === 'probe')) { queueEvent('probe', null); ch = true; }
  if (now >= S.candT) { S.cands = genCands(); S.candT = now + 120000; ch = true; }
  return ch;
}

  if (S.money < c.price) return toast(`Не хватает ${fmt(c.price - S.money)} ₽`);
  S.money -= c.price; delete c.price;
  S.cands = S.cands.filter(x => x !== c);

}
function evChoose(i) {

  const o = e.oid ? oById(e.oid) : null, b = e.bid ? oById(e.bid) : null, op = EV[e.kind].opts(o, b, e)[i];
  if (!op) return;
  if (op.cost && S.money < op.cost) return toast(`Не хватает ${fmt(op.cost - S.money)} ₽`);
  if (op.cost) S.money -= op.cost;

function offAct(o, act, btn) {

    S.money -= c; o.mor += 20; o.cor -= 10; o.cd.bonus = now + 90000; toast(`Премия выдана: ${o.name}`);
  }
  else if (act === 'rest' || act === 'vac') {

    if (act === 'vac') { if (S.money < 100) return toast('Не хватает 100 ₽ на отпускные'); S.money -= 100; }
    o.rest = now + (act === 'vac' ? 90000 : 30000); o.restKind = act; o.fat = 0; o.mor += act === 'vac' ? 30 : 5;
    toast(act === 'vac' ? `${o.name} уехал${a} в отпуск` : `${o.name} уш${o.fem ? 'ла' : 'ёл'} на отгул`);
  }
  else if (act === 'warn') { o.warn++; o.mor -= 15; o.cor -= 25; toast(`Выговор: ${o.name}`); if (o.warn >= 4) queueEvent('fireWarn', o); }
  else if (act === 'audit') {

  }
  else if (act === 'fire') {

  const a = S.ast[k];
  let h = head(AST[k].n, a ? `${a.name} · уровень ${a.lv}` : '') + `<p class="muted" style="margin:0 0 10px">${AST[k].d}</p>`;
  for (const r of RULES[k]) h += `<div class="rule"><span>${r.n}</span><div class="seg">${r.v.map(([val, lbl]) => `<button type="button" class="${S.rules[r.k] === val ? 'on' : ''}" data-rule="${r.k}" data-val="${esc(JSON.stringify(val))}">${lbl}</button>`).join('')}</div></div>`;
  if (a) h += `<div class="row"><button type="button" class="btn danger" data-astact="fire:${k}">Уволить</button></div>`;
  return h;
}
function vHQ() {
  let h = '<h3 class="sub">Штаб участка · помощники</h3><p class="muted" style="margin:-4px 0 8px">Берут на себя рутину по твоим правилам. Ошибаются, а спорное передают тебе.</p><div class="list">';
  for (const k in AST) {
    const A = AST[k], a = S.ast[k];
    if (!a) {
      const lock = hq() < A.hq;
      h += `<div class="card ast"><span class="por evx">${A.icon}</span><div class="info"><b>${A.n}</b><small>${A.d}</small></div>
        <button type="button" class="btn primary" data-asthire="${k}" data-cost="${A.cost}" ${lock ? 'disabled' : ''}>${lock ? `Участок ур. ${A.hq}` : `<span class="cost">${fmt(A.cost)} ₽</span>`}</button></div>`;
      continue;
    }
    h += `<div class="card ast${a.on ? '' : ' off'}"><img class="por" src="${portrait(a)}" alt=""><div class="info"><b>${A.icon} ${A.n} · ${a.name}</b>
      <small>${'★'.repeat(a.lv)}${'☆'.repeat(3 - a.lv)} · точность ~${Math.round(ACC[a.lv] * 100)}% · ${astSalOf(k, a)} ₽/мин${a.on ? '' : ' · снят со смены'}</small>
      <div class="row wrap"><button type="button" class="btn sm" data-astrules="${k}">Правила</button><button type="button" class="btn sm" data-astact="toggle:${k}">${a.on ? 'Снять со смены' : 'Вернуть на смену'}</button>
      ${a.lv < 3 ? `<button type="button" class="btn sm" data-astact="train:${k}" data-cost="${TRAIN[a.lv + 1]}">Обучить · <span class="cost">${fmt(TRAIN[a.lv + 1])} ₽</span></button>` : ''}
      ${k === 'zav' ? '<button type="button" class="btn sm" data-astact="revision:zav" data-cost="100">Ревизия · <span class="cost">100 ₽</span></button>' : ''}</div>
      ${k === 'zav' && S.bq.length ? `<div class="bq">${S.bq.map((q, j) => `<span>${q.type ? 'Стройка: ' + B[q.type].name : 'Улучшение: ' + B[S.plots[q.i].type].name}<button type="button" class="xs" data-unq="${j}" aria-label="Убрать из очереди">✕</button></span>`).join('')}</div>` : ''}</div></div>`;
  }
  h += '</div>';
  if (S.alog.length) h += '<h3 class="sub">Журнал штаба</h3><div class="alog">' + S.alog.slice(0, 8).map(l => `<div class="al ${l.ok === true ? 'ok' : l.ok === false ? 'bad' : ''}"><b>${AST[l.who].icon}</b><span>${esc(l.text)}</span></div>`).join('') + '</div>';
  return h;
}

    <p class="muted" style="margin:-8px 0 10px">Следующая выплата через <span data-end="${S.nextPay}"></span> · нажми на сотрудника, чтобы открыть досье</p>`;

        <span class="staff-overline"><span class="staff-unit">${c.short} · № ${String(i + 1).padStart(2, '0')}</span><span class="st ${st.k}">${st.text}</span></span>
        <span class="staff-name">${o.name}${o.sp ? ` <em class="spb">+${o.sp}</em>` : ''}</span>
        <span class="staff-rank">${OR[o.rank]} · ${c.name} · ур. ${o.lv}</span>
        <span class="staff-id">ДОСЬЕ ${o.id.slice(0, 5).toUpperCase()}</span></span></span>
      <span class="staff-metrics"><span class="staff-metric morale"><span class="staff-metric-label"><span>Настроение</span><b data-omor-num="${o.id}">${Math.round(o.mor)}%</b></span><span class="staff-track"><i data-omor="${o.id}" style="width:${o.mor}%"></i></span></span>
        <span class="staff-metric fatigue"><span class="staff-metric-label"><span>Усталость</span><b data-ofat-num="${o.id}">${Math.round(o.fat)}%</b></span><span class="staff-track"><i data-ofat="${o.id}" style="width:${o.fat}%"></i></span></span></span>
      <span class="staff-footer"><span class="staff-focus">Сильный навык: <b>${SK[skill]} ${o.sk[skill]}/10</b>${o.st.calls ? ` · ${Math.round(o.st.ok / o.st.calls * 100)}% успеха` : ''}</span><span class="chips">${traitChips(o)}</span></span></button>`;
  }
  h += '</div>';
  if (sev.length) {
    h += '<h3 class="sub">Просят разговора</h3><div class="list">';
    for (const e of sev) {

      h += `<button type="button" class="evc" data-ev="${e.id}">${o ? `<img class="por" src="${portrait(o)}" alt="">` : '<span class="por evx">⚖️</span>'}
        <span class="info"><b>${EV[e.kind].title}</b><small>${o ? o.name + ': ' : ''}${esc(e.text)}</small></span><span class="st busy">Выслушать</span></button>`;
    }
    h += '</div>';
  }
  h += vHQ();
  h += '<h3 class="sub">Кадровый резерв</h3>';

      <span class="unit-mark">Кандидат / ${role.short}</span><b class="candidate-name">${c.name}, ${c.age}</b>

      <div class="candidate-foot"><small>Сильный навык: <b>${SK[bestSkill(c)]} ${c.sk[bestSkill(c)]}/10</b></small>
      <button type="button" class="btn primary" data-hire="${c.id}" data-cost="${c.price}" ${lock ? 'disabled' : ''}>${lock ? `Участок ур. ${role.hq}` : `Нанять · <span class="cost">${fmt(c.price)} ₽</span>`}</button></div></div>`;
  }
  if (!S.cands.length) h += '<p class="muted">Кандидатов пока нет.</p>';
  h += `</div><button type="button" class="btn wide" style="margin-top:8px" data-recands data-cost="50">Позвать новых кандидатов · <span class="cost">50 ₽</span></button>
    <div style="margin-top:28px;text-align:center"><button type="button" class="btn danger" data-reset>Начать карьеру заново</button></div>`;

}

function callCard(m) {
  const t = MT[m.type];
  if (m.start) {
    const names = S.officers.filter(o => m.squad.includes(o.id)).map(o => o.name.split(' ')[1]).join(', ');
    return `<article class="call" style="--c:${t.color}"><div class="call-top"><span class="chip">${t.name}</span>
      <span class="exp">рапорт через <span data-end="${m.end}"></span></span></div><h3>${m.name}</h3>
      <div class="bar big"><i data-start="${m.start}" data-end="${m.end}"></i></div>
      <span class="muted">${names} · шанс ${Math.round(m.chance * 100)}% · ${missionApproach(m).name}</span>
      ${m.radioPending ? `<button type="button" class="btn primary wide" style="margin-top:9px" data-radio-open="${m.id}">📻 Ответить наряду · <span data-end="${m.radioDeadline}"></span></button>` : m.radioChoice && m.radioChoice !== 'plan' ? `<p class="syn" style="margin-top:6px">📻 Приказ: ${RADIO[m.radioChoice]?.name || 'принят'}</p>` : ''}</article>`;
  }
  return `<article class="call${m.urgent ? ' urgent' : ''}" style="--c:${t.color}">
    <div class="call-top"><span class="chip">${t.name}</span>${m.urgent ? '<span class="chip code">Код 3 · срочно</span>' : ''}
    <span class="tier" title="Сложность ${m.tier}">${'●'.repeat(Math.min(m.tier, 6))}</span>
    <span class="exp">снимут через <span data-end="${m.exp}"></span></span></div>
    <h3>${m.name}</h3>${m.addr ? `<p class="addr">📍 ${esc(m.addr)}${m.dist ? ' · ' + m.dist : ''}</p>` : ''}${m.esc ? `<p class="why" style="margin:0 0 8px">🗺️ Диспетчер: ${m.esc}</p>` : ''}
    <dl class="meta"><div><dt>Нужна сила</dt><dd>${m.known === false ? '?' : m.diff}</dd></div><div><dt>Время</dt><dd>${fmtT(m.baseDur * durMult())}</dd></div>
    <div><dt>Награда</dt><dd>${fmt(m.money * rewMult())} ₽ · ${m.rep}★</dd></div></dl>
    ${m.intel ? `<p class="syn">📋 Сведения из звонка: ${m.intel} · шанс +${Math.round(Math.min(5, m.intel) * 1.2)}%</p>` : ''}
    <button type="button" class="btn primary wide" data-send="${m.id}">Собрать отряд</button></article>`;
}

function vCalls() {
  const act = S.missions.filter(m => m.start), av = S.missions.filter(m => !m.start);
  const status = (astOn('op') ? '<span class="st rest">🎧 оператор на линии</span> ' : '') + (!S.call ? '<span class="st free">Линия 102 свободна</span>' : S.call.state === 'ring' ? '<span class="st hurt">Звонит телефон</span>' : '<span class="st busy">Идёт разговор</span>');
  let h = `<div class="sec-head"><h2>Дежурная часть</h2>${status}</div>
    <div class="dmapwrap" id="dmapSlot"></div>
    <p class="maphint"><b style="color:${MT.patrol.color}">●</b> патруль · <b style="color:${MT.invest.color}">●</b> расследование · <b style="color:${MT.assault.color}">●</b> штурм · пунктир — примерный адрес</p>`;
  if (S.call && S.call.state === 'talk' && !sheetCtx) h += '<button type="button" class="btn primary wide" style="margin-top:10px" data-resume>Вернуться к звонку</button>';
  h += `<h3 class="sub">Ждут наряда · свободно ${S.officers.filter(avail).length} сотр.</h3>`;
  h += av.length ? '<div class="list">' + av.map(callCard).join('') + '</div>'
    : '<p class="empty-note">Принятые вызовы появятся здесь. Отвечай на звонки 102, расспрашивай и решай, кого отправить.</p>';

/* ---------- шторка ---------- */
let sheetCtx = null, sel = new Set(), resetArm = false;
const head = (title, sub) => `<div class="sh-head"><div>${sub ? `<span class="muted">${sub}</span>` : ''}<h2>${title}</h2></div><button type="button" class="x" data-close aria-label="Закрыть">✕</button></div>`;

function sheetPlot(i) {
  const p = S.plots[i];
  if (!unlocked().has(i)) return head('Закрытый квартал') + `<p class="muted">Откроется, когда Участок достигнет ур. ${lockLv(i)}.</p>`;
  if (!p) {
    let h = head('Новая стройка', 'Свободный квартал');
    if (buildBusy()) h += '<p class="why" style="margin:0 0 10px">Бригада занята: дождись окончания текущей стройки.</p>';
    h += '<div class="list">';
    for (const k in B) {
      if (k === 'hq') continue;
      const b = B[k], c = cost(k, 1), mx = maxCount(k), n = plotsOf(k).length;
      const why = hq() < b.hq ? `Нужен Участок ур. ${b.hq}` : n >= mx ? `Лимит: ${n} из ${mx}. Повысь Участок` : '';
      h += `<div class="card opt"><span class="ic">${b.icon}</span><div class="grow"><b>${b.name}</b><p>${b.desc} Ур. 1: ${effTxt(k, 1)}.</p>
        ${why ? `<p class="why">${why}</p>` : `<button type="button" class="btn primary wide" data-build="${k}" data-cost="${c}" ${buildBusy() ? 'disabled' : ''}>Построить · <span class="cost">${fmt(c)} ₽</span> · ${fmtT(btime(k, 1))}</button>${S.ast.zav ? `<button type="button" class="btn wide" style="margin-top:6px" data-queue="b:${i}:${k}">📋 В очередь завхозу</button>` : ''}`}</div></div>`;
    }
    return h + '</div>';
  }
  const b = B[p.type];
  let h = head(b.name, `Уровень ${p.lv} из ${b.max}`) + `<div class="bld-hero"><span class="ic">${b.icon}</span><p class="muted" style="margin:0">${b.desc}</p></div>`;
  if (p.lv) h += `<div class="kv"><span>Сейчас</span><b>${effTxt(p.type, p.lv)}</b></div>`;
  if (p.type === 'biz' && p.lv) h += `<div class="kv"><span>В кассе</span><b><span data-store="${i}"></span> из ${bizCap(p.lv)} ₽</b></div>
    <button type="button" class="btn wide" style="margin-top:10px" data-collect="${i}">Забрать налоги</button>`;
  if (p.build) {
    h += `<div class="kv"><span>${p.lv ? `Улучшение до ур. ${p.build.to}` : 'Идёт стройка'}</span><b data-end="${p.build.end}"></b></div>
      <div class="bar big" style="--c:${b.c}"><i data-start="${p.build.start}" data-end="${p.build.end}"></i></div>`;
  } else if (p.lv >= b.max) h += '<p class="muted">Максимальный уровень.</p>';
  else {
    const to = p.lv + 1, c = cost(p.type, to);
    let why = '';
    if (p.type === 'hq' && S.rep < HQ_REP[to]) why = `Нужно ${HQ_REP[to]} ★ доверия, сейчас ${fmt(S.rep)}`;
    if (p.type !== 'hq' && to > hq()) why = `Сначала повысь Участок до ур. ${to}`;
    if (!why && buildBusy()) why = 'Бригада занята другой стройкой';
    h += `<div class="kv"><span>На ур. ${to}</span><b>${effTxt(p.type, to)}</b></div>`;
    if (p.type === 'hq') h += `<div class="kv"><span>Откроется</span><b>${HQ_UNLOCK[to]}</b></div>`;
    h += `<button type="button" class="btn primary wide" style="margin-top:12px" data-upgrade="${i}" data-cost="${c}" ${why ? 'disabled' : ''}>Улучшить · <span class="cost">${fmt(c)} ₽</span> · ${fmtT(btime(p.type, to))}</button>${why ? `<p class="why">${why}</p>` : ''}${S.ast.zav && (why === '' || buildBusy() || p.type === 'hq') ? `<button type="button" class="btn wide" style="margin-top:6px" data-queue="u:${i}">📋 В очередь завхозу</button>` : ''}`;
  }
  return h;
}

function sheetSquad(m) {
  const sp = squadPower([...sel], m.type), P = sp.P;
  const ch = sel.size ? missionChance(m, sp) : 0, kn = m.known !== false;
  const ap = missionApproach(m);
  let h = head(m.name, MT[m.type].name + (m.urgent ? ' · Код 3' : '') + (m.addr ? ' · ' + esc(m.addr) : ''));
  h += `<div class="odds ${!kn ? 'mid' : ch >= .75 ? 'good' : ch >= .45 ? 'mid' : 'bad'}"><div><small>Сила отряда</small><b>${P} / ${kn ? m.diff : '?'}</b></div><div><small>Шанс успеха</small><b>${kn ? Math.round(ch * 100) + '%' : '?'}</b></div></div>
    ${kn ? '' : '<p class="why" style="margin:0 0 8px">Опасность неизвестна: ты не спросил про оружие и число участников.</p>'}${m.vague ? '<p class="why" style="margin:0 0 8px">Адрес примерный: наряду придётся поискать место.</p>' : ''}
    ${m.intel ? `<p class="syn">📋 ${m.intel} уточнений из звонка: +${Math.round(Math.min(5, m.intel) * 1.2)}% к шансу</p>` : ''}${m.safeGuide ? '<p class="syn">🛡️ Заявитель предупреждён об опасности</p>' : ''}
    ${sp.notes.map(n => `<p class="syn">🤝 ${n}</p>`).join('')}${sp.luck ? '<p class="syn">🍀 В отряде везунчик: +5% к шансу</p>' : ''}
    <p class="muted" style="margin:0 0 10px">В отряде до ${squadMax()} чел. Сила зависит от навыков, черт, снаряжения, настроения и усталости. Напарники в одном отряде работают лучше.</p>
    <h3 class="sub">Тактика выезда</h3><div class="approaches">${Object.entries(APPROACH).map(([id, a]) => `<button type="button" class="approach${(m.approach || 'standard') === id ? ' on' : ''}" data-approach="${id}" aria-pressed="${(m.approach || 'standard') === id}" ${S.money < a.cost ? 'disabled' : ''}><b>${a.name}</b><small>${a.hint}</small></button>`).join('')}</div>
    <p class="call-hint">Выбранная тактика: ${ap.name}. Время ${fmtT(missionDuration(m))}${ap.cost ? ` · стоимость ${ap.cost} ₽` : ''}. Шанс выше после уточнений, а осторожный выезд дольше занимает сотрудников.</p><div class="list">`;
  const list = [...S.officers].sort((a, b) => (avail(b) - avail(a)) || (eff(b, m.type) - eff(a, m.type)));
  for (const o of list) {
    const c = CLS[o.cls], a = avail(o), on = sel.has(o.id);
    h += `<button type="button" class="pick${on ? ' on' : ''}" data-tog="${o.id}" aria-pressed="${on}" ${a ? '' : 'disabled'}>
      <img class="por" src="${portrait(o)}" alt=""><span class="info"><b>${o.name}</b><small>${OR[o.rank]} · ${c.name}${a ? '' : ' · ' + statusOf(o).text.replace(/<[^>]+>/g, '').trim().toLowerCase()}</small>
      <span class="meters"><span class="mt"><i class="mor" style="width:${o.mor}%"></i></span><span class="mt"><i class="fat" style="width:${o.fat}%"></i></span></span></span>
      <span class="pw">${eff(o, m.type)}${c.match === m.type ? '<em>профиль</em>' : ''}${o.partner && sel.has(o.partner) ? '<em>с напарником</em>' : ''}</span></button>`;
  }
  return h + `</div><div class="row"><button type="button" class="btn" data-auto>Лучший состав</button>
    <button type="button" class="btn primary grow" data-go ${sel.size && S.money >= ap.cost ? '' : 'disabled'}>Отправить · ${fmtT(missionDuration(m))}${ap.cost ? ` · ${ap.cost} ₽` : ''}</button></div>`;
}

function sheetRadio(m) {
  if (!m || !m.radioPending) return head('Связь с нарядом') + '<p class="muted">Наряд продолжает работу по плану.</p>';
  return head('Наряд запрашивает приказ', esc(m.name)) +
    `<p class="narr">Сотрудники добрались до места и уточнили обстановку. Нужно решить, как действовать дальше. Ответить можно ещё <b data-end="${m.radioDeadline}"></b>.</p>
    <div class="odds"><div><small>Текущий шанс</small><b>${Math.round(m.chance * 100)}%</b></div><div><small>Рапорт через</small><b data-end="${m.end}"></b></div></div>
    <div class="list">${Object.entries(RADIO).map(([id, r]) => `<button type="button" class="approach" data-radio-order="${id}" ${S.money < r.cost ? 'disabled' : ''}><b>${r.name}</b><small>${r.hint}</small></button>`).join('')}</div>`;
}

function sheetReport(r) {
  const sg = v => (v < 0 ? '−' : '+') + Math.abs(v);
  if (r.kind === 'call' || r.kind === 'info') return `<div class="report${r.ok ? '' : ' fail'}"><small>${r.label || 'Итог звонка'}</small><h2>${r.title}</h2><p>${esc(r.text)}</p></div>
    ${r.rep ? `<div class="kv"><span>Доверие</span><b>${sg(r.rep)} ★</b></div>` : ''}
    <button type="button" class="btn primary wide" style="margin-top:14px" data-ack>Принято</button>`;
  return `<div class="report${r.ok ? '' : ' fail'}"><small>Рапорт · ${MT[r.type].name}</small><h2>${r.fake ? r.title : r.ok ? 'Задание выполнено' : 'Провал'}</h2>
    <p>${r.fake ? esc(r.note) : `${r.name}. ${r.ok ? 'Подозреваемые задержаны.' : 'Подозреваемым удалось скрыться.'}`}</p>${r.approach ? `<small>Тактика: ${APPROACH[r.approach]?.name || APPROACH.standard.name} · рация: ${RADIO[r.radioChoice]?.name || RADIO.plan.name}${r.intel ? ` · уточнений: ${r.intel}` : ''}${r.safeGuide ? ' · заявитель предупреждён' : ''}</small>` : ''}</div>
    <div class="kv"><span>Награда</span><b>+${fmt(r.money)} ₽</b></div>${r.spent ? `<div class="kv"><span>Поддержка</span><b>−${fmt(r.spent)} ₽</b></div>` : ''}<div class="kv"><span>Доверие</span><b>${sg(r.rep)} ★</b></div>
    <h3 class="sub">Отряд</h3><div>${r.lines.map(l => { const o = S.officers.find(x => x.id === l.id); return `<div class="rl"><span class="who">${o ? `<img class="por sm" src="${portrait(o)}" alt="">` : ''}<b>${l.name}</b></span><span>+${l.gain} опыта${l.up ? ` · <em class="up">ур. ${l.lv}!</em>` : ''}${l.hurt ? ' · <em class="hurtx">ранен</em>' : ''}</span></div>`; }).join('')}</div>
    <button type="button" class="btn primary wide" style="margin-top:14px" data-ack>Принято</button>`;
}

function renderSheet() {
  if (!sheetCtx) return closeSheet();
  let h;
  if (sheetCtx.kind === 'plot') h = sheetPlot(sheetCtx.i);
  else if (sheetCtx.kind === 'report') { if (!S.reports.length) return closeSheet(); h = sheetReport(S.reports[0]); }
  else if (sheetCtx.kind === 'call') {
    if (!S.call || S.call.state !== 'talk') { sheetCtx = null; $('#sheetBg').hidden = true; return; }
    h = sheetCall(S.call);
  }
  else if (sheetCtx.kind === 'dos') {
    const o = oById(sheetCtx.id);
    if (!o) { sheetCtx = null; $('#sheetBg').hidden = true; return; }
    h = sheetDos(o);
  }
  else if (sheetCtx.kind === 'nego') h = sheetNego();
  else if (sheetCtx.kind === 'radio') h = sheetRadio(S.missions.find(x => x.id === sheetCtx.id));
  else if (sheetCtx.kind === 'rules') { if (!S.ast[sheetCtx.k]) { sheetCtx = null; $('#sheetBg').hidden = true; return; } h = sheetRules(sheetCtx.k); }
  else if (sheetCtx.kind === 'event') {
    const e = S.events.find(x => x.id === sheetCtx.id);
    if (!e || !eventValid(e)) { S.events = S.events.filter(x => x !== e); sheetCtx = null; $('#sheetBg').hidden = true; return; }
    h = sheetEvent(e);
  }
  else {
    const m = S.missions.find(x => x.id === sheetCtx.id);
    if (!m || m.start) { toast('Вызов уже снят'); return closeSheet(); }
    for (const id of [...sel]) { const o = S.officers.find(x => x.id === id); if (!o || !avail(o)) sel.delete(id); }
    h = sheetSquad(m);
  }
  const sh = $('#sheet'), top = sh.scrollTop;
  sh.innerHTML = h; $('#sheetBg').hidden = false; sh.scrollTop = top;
  updateDyn();
  if (sheetCtx.kind === 'call') afterCallRender();
}
function closeSheet() {
  if (sheetCtx && sheetCtx.kind === 'call') return;
  if (sheetCtx && sheetCtx.kind === 'report') { S.reports.shift(); save(); }
  sheetCtx = null; $('#sheetBg').hidden = true;
}

/* ---------- отрисовка ---------- */
function render() {
  document.querySelectorAll('[data-tab]').forEach(b => b.dataset.tab === S.tab ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current'));
  const v = $('#view'), top = v.scrollTop;
  v.innerHTML = S.tab === 'city' ? vCity() : S.tab === 'staff' ? vStaff() : S.tab === 'mayor' ? vMayor() : vCalls();
  if (S.tab === 'city') { $('#mapSlot').appendChild(mapCv); fitMap(); startMap(); }
  if (S.tab === 'calls') { $('#dmapSlot').appendChild(dCv); fitD(); startD(); }
  v.scrollTop = top;
  updateTop(); updateDyn();
}
function updateTop() {
  $('#money').textContent = fmt(S.money);
  $('#inc').textContent = '+' + income().toFixed(1).replace('.0', '') + '/с';
  $('#rep').textContent = fmt(S.rep);
  $('#rank').textContent = rankOf(S.rep);
  const n = S.missions.filter(m => !m.start || m.radioPending).length + (S.call ? 1 : 0), nb = $('#callsN');
  nb.textContent = n; nb.hidden = !n;
  $('#spdTxt').textContent = SPEED_LBL[S.speed];
  $('#speedbar').classList.toggle('paused', !S.speed);
  document.querySelectorAll('[data-speed]').forEach(b => b.setAttribute('aria-pressed', +b.dataset.speed === S.speed));
  const sn = $('#staffN'), ne = S.events.filter(e => !EV[e.kind].city).length;
  sn.textContent = ne; sn.hidden = !ne;
  const mn = $('#mayorN'), nm = S.events.filter(e => EV[e.kind].city).length + S.city.orders.filter(o => o.state === 'offer').length + (S.city.elect.phase === 'campaign' && S.city.elect.sup === null ? 1 : 0);
  mn.textContent = nm; mn.hidden = !nm;
  const ringing = !!S.call && S.call.state === 'ring';
  $('#ring').hidden = !ringing;
  if (ringing) { $('#ringTitle').textContent = S.call.esc ? 'Оператор переводит звонок' : 'Звонок на 102'; $('#ringNum').textContent = `${S.call.esc ? S.call.esc + ' · ' : S.call.phone + ' · '}ещё ${fmtT((S.call.ringEnd - gnow()) / 1000)}`; }
}
function updateDyn() {
  const now = gnow();
  document.querySelectorAll('[data-end]').forEach(el => {
    const e = +el.dataset.end;
    if (el.hasAttribute('data-start')) { const s = +el.dataset.start; el.style.width = clamp((now - s) / (e - s), 0, 1) * 100 + '%'; }
    else el.textContent = fmtT((e - now) / 1000);
  });
  const clock = document.querySelector('.call-clock');
  if (clock && S.call?.talkEnd) clock.classList.toggle('hot', S.call.talkEnd - now < 16000);
  document.querySelectorAll('[data-store]').forEach(el => {
    const p = S.plots[+el.dataset.store], v = Math.floor(stored(p));
    el.textContent = el.classList.contains('coin') ? '+' + fmt(v) : fmt(v);
    if (el.classList.contains('coin')) { el.hidden = v < 5; el.classList.toggle('full', !!p && v >= bizCap(p.lv)); }
  });
  document.querySelectorAll('[data-cost]').forEach(el => el.classList.toggle('short', S.money < +el.dataset.cost));
  document.querySelectorAll('[data-omor]').forEach(el => { const o = oById(el.dataset.omor); if (o) el.style.width = o.mor + '%'; });
  document.querySelectorAll('[data-ofat]').forEach(el => { const o = oById(el.dataset.ofat); if (o) el.style.width = o.fat + '%'; });
  document.querySelectorAll('[data-omor-num]').forEach(el => { const o = oById(el.dataset.omorNum); if (o) el.textContent = Math.round(o.mor) + (el.dataset.suffix === '' ? '' : '%'); });
  document.querySelectorAll('[data-ofat-num]').forEach(el => { const o = oById(el.dataset.ofatNum); if (o) el.textContent = Math.round(o.fat) + '%'; });
}

/* ---------- ввод ---------- */
document.addEventListener('click', e => {
  unlockAudio();
  const t = e.target.closest('button');
  if (!t) { if (e.target.id === 'sheetBg') closeSheet(); return; }
  const d = t.dataset;
  if (d.tab) { S.tab = d.tab; render(); save(); }
  else if (d.speed !== undefined) setSpeed(+d.speed);
  else if (d.rot) rotateCity(+d.rot);
  else if ('nego' in d) { sheetCtx = {kind: 'nego'}; renderSheet(); }
  else if (d.negopt !== undefined) negotiate(+d.negopt);
  else if (d.ord) {
    const [yn, id] = d.ord.split(':'), o = S.city.orders.find(x => x.id === id);
    if (!o || o.state !== 'offer') return;
    if (yn === 'yes') orderAccept(o);
    else { o.state = 'gone'; cityRel(-Math.round(6 * (S.city.mayor.course === 'hard' ? 1.5 : 1))); S.city.orders = S.city.orders.filter(x => x !== o); toast('Вы отказались от поручения. Мэр недоволен'); }
    render(); save();
  }
  else if (d.vote !== undefined) { const E = S.city.elect; if (E.phase !== 'campaign') return; const v = +d.vote; E.sup = v < 0 ? null : v; if (v < 0) E.push = 0; render(); save(); }
  else if ('campaign' in d) {
    const E = S.city.elect;
    if (E.phase !== 'campaign' || E.sup === null || E.push >= .16) return;
    if (S.money < 400) return toast('Не хватает 400 ₽');
    S.money -= 400; E.push += .08; addHeat(5); toast('Участок помог кампании. Шансы кандидата выросли'); render(); save();
  }
  else if (d.asthire) hireAst(d.asthire);
  else if (d.astact) { const [act, k] = d.astact.split(':'); astAct(k, act, t); }
  else if (d.astrules) { sheetCtx = {kind: 'rules', k: d.astrules}; renderSheet(); }
  else if (d.rule) { S.rules[d.rule] = JSON.parse(d.val); renderSheet(); save(); }
  else if (d.queue) {
    const [q, i, type] = d.queue.split(':');
    if (S.bq.length >= 6) return toast('Очередь завхоза заполнена');
    if (S.bq.some(x => x.i === +i)) return toast('Этот квартал уже в очереди');
    S.bq.push(q === 'b' ? {i: +i, type} : {i: +i});
    toast('Завхоз займётся, когда хватит денег и освободится бригада');
    closeSheet(); render(); save();
  }
  else if (d.unq !== undefined) { S.bq.splice(+d.unq, 1); render(); save(); }
  else if (d.plot !== undefined) tapPlot(+d.plot);
  else if ('answer' in d) answerCall();
  else if (d.ask) ask(d.ask);
  else if (d.guide) guideCall(d.guide);
  else if (d.decide) decide(d.decide);
  else if ('voice' in d) { S.voice = !S.voice; if (!S.voice) { try { speechSynthesis.cancel(); } catch (err) {} } renderSheet(); save(); }
  else if ('resume' in d) { if (S.call && S.call.state === 'talk') { sheetCtx = {kind: 'call'}; renderSheet(); render(); } }
  else if ('close' in d) closeSheet();
  else if (d.build) build(sheetCtx.i, d.build);
  else if (d.upgrade) upgrade(+d.upgrade);
  else if (d.collect) { collect(+d.collect); renderSheet(); }
  else if (d.hire) hireCand(d.hire);
  else if (d.dos) { sheetCtx = {kind: 'dos', id: d.dos}; renderSheet(); }
  else if (d.ev) { sheetCtx = {kind: 'event', id: d.ev}; renderSheet(); }
  else if (d.evopt !== undefined) evChoose(+d.evopt);
  else if ('recands' in d) {
    if (S.money < 50) return toast('Не хватает 50 ₽');
    S.money -= 50; S.cands = genCands(); S.candT = gnow() + 120000; render(); save();
  }
  else if (sheetCtx && sheetCtx.kind === 'dos' && (d.oact || d.sp || 'spauto' in d || d.gslot || d.buy || 'pairlist' in d || d.pair || 'unpair' in d)) {
    const o = oById(sheetCtx.id);
    if (!o) return;
    if (d.oact) offAct(o, d.oact, t);
    else if (d.sp) spendSp(o, d.sp);
    else if ('spauto' in d) autoSp(o);
    else if (d.gslot) { sheetCtx.gear = sheetCtx.gear === d.gslot ? null : d.gslot; renderSheet(); }
    else if (d.buy) { const [s, id] = d.buy.split(':'); buyGear(o, s, id); }
    else if ('pairlist' in d) { sheetCtx.pair = !sheetCtx.pair; renderSheet(); }
    else if (d.pair) setPair(o, oById(d.pair));
    else if ('unpair' in d) unpair(o);
  }
  else if (d.send) openSquad(d.send);
  else if (d.radioOpen) { const m = S.missions.find(x => x.id === d.radioOpen); if (m && m.radioPending) { sheetCtx = {kind: 'radio', id: m.id}; renderSheet(); } }
  else if (d.radioOrder && sheetCtx && sheetCtx.kind === 'radio') radioOrder(S.missions.find(x => x.id === sheetCtx.id), d.radioOrder);
  else if (d.approach && sheetCtx && sheetCtx.kind === 'squad' && APPROACH[d.approach]) {
    const m = S.missions.find(x => x.id === sheetCtx.id);
    if (m && !m.start && S.money >= APPROACH[d.approach].cost) { m.approach = d.approach; renderSheet(); save(); }
  }
  else if (d.tog) {
    if (sel.has(d.tog)) sel.delete(d.tog);
    else if (sel.size >= squadMax()) return toast(`В отряде максимум ${squadMax()} чел.`);
    else sel.add(d.tog);
    renderSheet();
  }
  else if ('auto' in d) {
    const m = S.missions.find(x => x.id === sheetCtx.id);
    sel = new Set(S.officers.filter(avail).sort((a, b) => eff(b, m.type) - eff(a, m.type)).slice(0, squadMax()).map(o => o.id));
    renderSheet();
  }
  else if ('go' in d) { const m = S.missions.find(x => x.id === sheetCtx.id); if (m) dispatch(m); }
  else if ('ack' in d) closeSheet();
  else if ('tipoff' in d) { S.tip = false; render(); save(); }
  else if ('reset' in d) {
    if (!resetArm) { resetArm = true; t.textContent = 'Точно? Весь прогресс пропадёт. Нажми ещё раз'; setTimeout(() => { resetArm = false; if (t.isConnected) t.textContent = 'Начать карьеру заново'; }, 3000); return; }
    resetArm = false; fresh(); closeSheet(); render(); save(); toast('Новая карьера началась');
  }
});
function setSpeed(i) {
  const was = S.speed;
  S.speed = clamp(i, 0, SPEEDS.length - 1);
  if (S.speed) S.prevSpeed = S.speed;
  if (!was !== !S.speed) { toast(S.speed ? 'Игра продолжается' : 'Пауза: время в городе остановлено'); render(); }
  updateTop(); save();
}
function rotateCity(dir) {
  S.rot = ((S.rot || 0) + dir + 4) % 4;
  if (S.tab === 'city') render();
  save();
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && sheetCtx) return closeSheet();
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.code === 'KeyP') setSpeed(S.speed ? 0 : S.prevSpeed || 2);
  else if (/^Digit[1-4]$/.test(e.code)) setSpeed(+e.code.slice(5));
  else if (S.tab === 'city' && (e.code === 'KeyQ' || e.code === 'KeyE')) rotateCity(e.code === 'KeyQ' ? -1 : 1);
});
addEventListener('pagehide', save);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); else if (S.tab === 'city') startMap(); else if (S.tab === 'calls') startD(); });
if (window.ResizeObserver) new ResizeObserver(() => { if (S.tab === 'city') fitMap(); if (S.tab === 'calls') fitD(); }).observe($('#view'));

/* запуск: если старое сохранение ломает игру — показываем причину и даём начать заново, а не пустой экран */
function bootFail(err) {
  if ($('#bootfail')) return;
  const box = document.createElement('div');
  box.id = 'bootfail';
  box.innerHTML = `<div class="card"><h2>Игра споткнулась</h2><p class="muted">Скорее всего, старое сохранение не подошло к новой версии.
    Можно начать заново — старое сохранение останется в резервной копии.</p><pre>${esc(String((err && err.message) || err))}</pre>
    <div class="row"><button type="button" class="btn primary grow" id="bootReset">Начать заново</button><button type="button" class="btn" id="bootClose">Закрыть</button></div></div>`;
  document.body.appendChild(box);
  $('#bootReset').onclick = () => {
    try { localStorage.setItem('uchastok7_backup', localStorage.getItem('uchastok7') || ''); } catch (e) {}
    box.remove(); tickErr = 0; sheetCtx = null; $('#sheetBg').hidden = true; S = null;
    fresh(); save(); render();
  };
  $('#bootClose').onclick = () => box.remove();
}
let tickErr = 0;
try {
  load();
  render();
  if (S.call && S.call.state === 'talk') { sheetCtx = {kind: 'call'}; renderSheet(); }
  tick();
} catch (err) { bootFail(err); }
setInterval(() => { try { tick(); tickErr = 0; } catch (err) { if (++tickErr === 3) bootFail(err); } }, 250);
setInterval(save, 3000);
</script>
